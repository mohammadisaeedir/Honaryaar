{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FD5956">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="اجرانو">
    <title>{% block title %}اجرانو{% endblock %}</title>
    <meta name="description" content="اجرانو، جای پیدا کردن هنرمند، پروژه و فرصت در تئاتر.">
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
    <link rel="icon" href="{% static 'brand/favicon.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,560&family=Outfit:wght@600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/alpine.min.js' %}" defer></script>
</head>
<body class="min-h-dvh overflow-x-clip bg-background text-sm leading-[22px] text-foreground antialiased">
    {% include "components/layout/header.html" %}
    <main class="mx-auto w-full min-w-0 max-w-5xl px-4 pb-24 pt-8 md:pb-16">
        {% block content %}{% endblock %}
    </main>
    {% include "components/layout/footer.html" %}
    {% include "components/layout/bottom_nav.html" %}
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("{% url 'service-worker' %}");
        }
    </script>
</body>
</html>
