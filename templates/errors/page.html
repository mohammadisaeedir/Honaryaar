{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{{ title }} · هنریار</title>
    <link rel="icon" href="{% static 'brand/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f6f4ef;
            color: #17131a;
            font-family: Peyda, sans-serif;
        }
        main {
            width: min(28rem, calc(100% - 32px));
            padding: 32px 0 48px;
            text-align: center;
        }
        img {
            height: 32px;
            width: auto;
        }
        .code {
            margin: 28px 0 8px;
            color: #c13281;
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            line-height: 32px;
        }
        p {
            margin: 8px 0 0;
            color: #5c5560;
            font-size: 14px;
            line-height: 24px;
        }
        a.home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            margin-top: 24px;
            padding: 0 18px;
            border-radius: 10px;
            background: #c13281;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <a href="{% url 'home' %}"><img src="{% static 'brand/logo-fa.svg' %}" alt="هنریار"></a>
        <p class="code">{{ code }}</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="home" href="{% url 'home' %}">بازگشت به خانه</a>
    </main>
</body>
</html>
