{% load ejranow_ui %}
<header>
    <p class="text-sm leading-[22px] text-muted-foreground">{{ project.category|category_title }} · {{ project.city }}</p>
    <h1 class="mt-2 text-[28px] font-semibold leading-9">{{ project.title }}</h1>
    <p class="mt-3 max-w-2xl text-sm leading-[22px]">{{ project.summary }}</p>
    <p class="mt-4 text-sm leading-[22px] text-muted-foreground">{{ project.lead }} · {{ project.lead_role|role_title }} · {{ project.status }}</p>
</header>
