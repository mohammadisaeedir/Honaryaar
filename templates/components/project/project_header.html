{% load ejranow_ui %}
<header>
    <p class="text-sm leading-[22px] text-muted-foreground"><span class="art-name art-{{ project.art }}">{{ project.art|art_title }}</span> · {{ project.city }}</p>
    <h1 class="mt-2 text-[28px] font-semibold leading-9">{{ project.title }}</h1>
    <p class="mt-3 max-w-2xl text-sm leading-[22px]">{{ project.summary }}</p>
    <p class="mt-4 text-sm leading-[22px] text-muted-foreground">{% if project.lead %}{{ project.lead }} · {% endif %}{{ project.lead_role|role_title }} · {{ project.status }}</p>
</header>
