{% load ejranow_ui %}
{% with name=request.resolver_match.url_name %}
<nav class="pf-mobile-menu" aria-label="حساب کاربری">
    <div class="pf-group {% if name == 'me-projects' or name == 'me-project' or name == 'me-project-new' %}is-open{% endif %}" x-data="{ open: {% if name == 'me-projects' or name == 'me-project' or name == 'me-project-new' %}true{% else %}false{% endif %} }" :class="open ? 'is-open' : ''">
        <button class="pf-mobile-menu__row" type="button" @click="open = !open" :aria-expanded="open.toString()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
            <span class="pf-mobile-menu__label">پروژه‌ها</span>
            <span class="pf-chev pf-sidebar__chev" aria-hidden="true"></span>
        </button>
        <div class="pf-sidebar__submenu" x-show="open" {% if name != 'me-projects' and name != 'me-project' and name != 'me-project-new' %}x-cloak{% endif %}>
            <a class="pf-mobile-menu__row pf-mobile-menu__row--sub {% if name == 'me-projects' or name == 'me-project' %}pf-mobile-menu__row--active{% endif %}" href="{% url 'me-projects' %}">
                <span class="pf-mobile-menu__label">پروژه‌های من</span>
            </a>
            <a class="pf-mobile-menu__row pf-mobile-menu__row--sub {% if name == 'me-project-new' %}pf-mobile-menu__row--active{% endif %}" href="{% url 'me-project-new' %}">
                <span class="pf-mobile-menu__label">ساخت پروژه و فرصت</span>
            </a>
        </div>
    </div>
    <div class="pf-group {% if name == 'me-matches' %}is-open{% endif %}" x-data="{ open: {% if name == 'me-matches' %}true{% else %}false{% endif %} }" :class="open ? 'is-open' : ''">
        <button class="pf-mobile-menu__row" type="button" @click="open = !open" :aria-expanded="open.toString()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7h10v8H7zM5 17h14" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>
            <span class="pf-mobile-menu__label">درخواست‌ها</span>
            <span class="pf-chev pf-sidebar__chev" aria-hidden="true"></span>
        </button>
        <div class="pf-sidebar__submenu" x-show="open" {% if name != 'me-matches' %}x-cloak{% endif %}>
            <a class="pf-mobile-menu__row pf-mobile-menu__row--sub" href="{% url 'me-matches' %}#applications"><span class="pf-mobile-menu__label">درخواست‌های من</span></a>
            <a class="pf-mobile-menu__row pf-mobile-menu__row--sub" href="{% url 'me-matches' %}#invites"><span class="pf-mobile-menu__label">دعوت‌ها</span></a>
            <a class="pf-mobile-menu__row pf-mobile-menu__row--sub" href="{% url 'me-matches' %}#matches"><span class="pf-mobile-menu__label">مچ‌ها</span></a>
        </div>
    </div>
    <hr class="pf-rule" aria-hidden="true">
    <button class="pf-mobile-menu__row" type="button" @click="logoutOpen = true; logoutStep = 1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 7V5h9v14h-9v-2M14 12H4m0 0l3-3m-3 3l3 3" stroke="#ef3b2e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span class="pf-mobile-menu__label pf-label--danger">خروج از حساب</span>
    </button>
</nav>
{% endwith %}
