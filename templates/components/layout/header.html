{% load static %}
<header class="sticky top-0 z-30 border-b border-border bg-background">
    <div class="mx-auto flex h-16 w-full min-w-0 max-w-5xl items-center gap-4 px-4">
        <a class="min-w-0 shrink" href="{% url 'home' %}">
            <img class="block h-8 w-auto" style="width: 6.5rem" src="{% static 'brand/logo-fa.svg' %}" alt="اجرانو" width="4132" height="1272">
        </a>
        <nav class="hidden items-center gap-6 text-sm font-semibold md:flex" aria-label="اصلی">
            <a class="{% if request.path == '/' %}text-foreground{% else %}text-muted-foreground{% endif %}" href="{% url 'home' %}">خانه</a>
            <a class="{% if '/opportunities/' in request.path or request.path == '/opportunities/' %}text-foreground{% else %}text-muted-foreground{% endif %}" href="{% url 'opportunities' %}">فرصت‌ها</a>
            <a class="{% if '/artists/' in request.path %}text-foreground{% else %}text-muted-foreground{% endif %}" href="{% url 'artists' %}">هنرمندان</a>
            <a class="{% if '/projects/' in request.path %}text-foreground{% else %}text-muted-foreground{% endif %}" href="{% url 'projects' %}">پروژه‌ها</a>
        </nav>
        <div class="ms-auto flex items-center gap-4">
            {% if user.is_authenticated %}
                <a class="inline-flex min-h-11 items-center text-sm font-semibold text-foreground" href="{% url 'me-profile' %}">پروفایل</a>
            {% else %}
                <a class="inline-flex min-h-11 items-center text-sm font-semibold text-foreground" href="{% url 'login' %}">ورود</a>
            {% endif %}
            <a class="inline-flex min-h-11 items-center text-sm font-semibold text-foreground" href="{% url 'search' %}">جستجو</a>
        </div>
    </div>
</header>
