<nav class="tabbar" aria-label="موبایل">
    <button class="tabbar__search {% if request.path == '/search/' %}is-active{% endif %}" type="button" aria-label="جستجو" @click="searchOpen = true">
        {% include "components/icon.html" with name="search" %}
    </button>
    <div class="tabbar__pill">
        <a class="{% if request.path == '/' %}is-active{% endif %}" href="{% url 'home' %}">
            {% include "components/icon.html" with name="house" %}
            <span>خانه</span>
        </a>
        <a class="{% if '/opportunities/' in request.path %}is-active{% endif %}" href="{% url 'opportunities' %}">
            {% include "components/icon.html" with name="megaphone" %}
            <span>فرصت‌ها</span>
        </a>
        <a class="{% if '/artists/' in request.path %}is-active{% endif %}" href="{% url 'artists' %}">
            {% include "components/icon.html" with name="users" %}
            <span>هنرمندان</span>
        </a>
        <a class="{% if request.path == '/projects/' or '/projects/' == request.path|slice:':10' %}is-active{% endif %}" href="{% url 'projects' %}">
            {% include "components/icon.html" with name="clapperboard" %}
            <span>پروژه‌ها</span>
        </a>
    </div>
</nav>
