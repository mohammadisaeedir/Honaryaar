{% load honaryaar_ui %}
<div x-data="{ open: false }">
    <div class="flex max-w-full gap-2 overflow-x-auto pb-1">
        <a class="inline-flex min-h-11 shrink-0 items-center rounded-full border px-3 text-xs {% if not filters.city and not filters.paid %}border-foreground text-foreground{% else %}border-border text-muted-foreground{% endif %}" href="{% url 'opportunities' %}" hx-get="{% url 'opportunities' %}" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true">همه</a>
        {% for city in featured_cities %}
            <a class="inline-flex min-h-11 shrink-0 items-center rounded-full border px-3 text-xs {% if filters.city == city %}border-foreground text-foreground{% else %}border-border text-muted-foreground{% endif %}" href="{% query_string request city=city %}" hx-get="{% query_string request city=city %}" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true">{{ city }}</a>
        {% endfor %}
        <a class="inline-flex min-h-11 shrink-0 items-center rounded-full border px-3 text-xs {% if filters.paid == 'paid' %}border-foreground text-foreground{% else %}border-border text-muted-foreground{% endif %}" href="{% query_string request paid='paid' %}" hx-get="{% query_string request paid='paid' %}" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true">پرداختی</a>
        <a class="inline-flex min-h-11 shrink-0 items-center rounded-full border px-3 text-xs {% if filters.paid == 'unpaid' %}border-foreground text-foreground{% else %}border-border text-muted-foreground{% endif %}" href="{% query_string request paid='unpaid' %}" hx-get="{% query_string request paid='unpaid' %}" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true">غیرپرداختی</a>
    </div>

    <button class="mt-3 inline-flex min-h-11 items-center justify-center rounded-input border border-border px-4 text-sm font-semibold" type="button" @click="open = true">فیلترها</button>

    <div class="fixed inset-0 z-40 bg-foreground/40" x-cloak x-show="open" @click="open = false"></div>
    <form class="fixed inset-x-0 bottom-0 z-50 max-h-[85dvh] overflow-auto rounded-t-[20px] border border-border bg-background p-4 pb-[max(16px,env(safe-area-inset-bottom))]" method="get" action="{% url 'opportunities' %}" x-cloak x-show="open" x-transition hx-get="{% url 'opportunities' %}" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true" @submit="open = false">
        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-[18px] font-semibold leading-[26px]">فیلترها</h2>
            <button class="inline-flex min-h-11 items-center px-2 text-sm" type="button" @click="open = false">بستن</button>
        </div>
        <input type="hidden" name="q" value="{{ filters.q }}">
        <label class="mb-4 block">
            <span class="field-label">شهر</span>
            <select class="field field-select" name="city">
                <option value="">همه</option>
                {% for city in cities %}
                    <option value="{{ city }}" {% if filters.city == city %}selected{% endif %}>{{ city }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="mb-4 block">
            <span class="field-label">نقش</span>
            <select class="field field-select" name="role">
                <option value="">همه</option>
                {% for role in roles %}
                    <option value="{{ role.slug }}" {% if filters.role == role.slug %}selected{% endif %}>{{ role.title }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="mb-4 block">
            <span class="field-label">نوع</span>
            <select class="field field-select" name="production">
                <option value="">همه</option>
                {% for production in productions %}
                    <option value="{{ production }}" {% if filters.production == production %}selected{% endif %}>{{ production }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="mb-4 block">
            <span class="field-label">جنسیت</span>
            <select class="field field-select" name="gender">
                <option value="">همه</option>
                {% for gender in genders %}
                    <option value="{{ gender.value }}" {% if filters.gender == gender.value %}selected{% endif %}>{{ gender.label }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="mb-4 block">
            <span class="field-label">پرداخت</span>
            <select class="field field-select" name="paid">
                <option value="">همه</option>
                <option value="paid" {% if filters.paid == "paid" %}selected{% endif %}>پرداختی</option>
                <option value="unpaid" {% if filters.paid == "unpaid" %}selected{% endif %}>غیرپرداختی</option>
            </select>
        </label>
        <label class="mb-6 block">
            <span class="field-label">سن</span>
            {% include "components/input.html" with name="age" value=filters.age placeholder="مثلاً ۲۸" inputmode="numeric" type="text" %}
        </label>
        <button class="inline-flex min-h-11 w-full items-center justify-center rounded-input bg-primary text-sm font-semibold text-white" type="submit">اعمال فیلتر</button>
    </form>
</div>
