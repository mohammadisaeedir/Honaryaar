{% load ejranow_ui %}
<header class="flex items-start gap-4">
    {% include "components/avatar.html" with name=artist.name size="size-16 text-[18px]" %}
    <div class="min-w-0">
        <h1 class="text-[28px] font-semibold leading-9">{{ artist.name }}</h1>
        <p class="mt-1 text-sm leading-[22px] text-muted-foreground">{{ artist.role|role_title }} · {{ artist.city }}</p>
        <div class="mt-3">{% status_chip artist.status %}</div>
    </div>
    <div class="pdp-actions">
        {% include "components/share.html" with title=artist.name %}
        <button class="report-link" type="button" @click="$dispatch('open-report')">گزارش</button>
    </div>
</header>
