<div class="search-suggest" x-cloak x-show="suggest" @mousedown.prevent>
    {% include "components/filters/recent.html" with scope=scope %}
    <p class="search-suggest__title">{% include "components/icon.html" with name="search" size="16" %}جستجوهای محبوب</p>
    <div class="search-suggest__chips">
        {% for chip in quick %}
            <a href="{{ chip.href }}">{{ chip.label }}</a>
        {% endfor %}
    </div>
</div>
