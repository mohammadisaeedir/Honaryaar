<div class="skel-pane skel-pdp skel-pdp--project" aria-hidden="true">
    <div class="skel-pdp__sheet">
        <div class="skel-pdp__poster">
            <span class="bone skel-pdp__poster-bone"></span>
        </div>
        <div class="skel-pdp__sheet-main">
            <div class="skel-row">
                <span class="bone"></span><span class="bone"></span><span class="bone"></span>
            </div>
            <div class="skel-pdp__title-row">
                <span class="bone bone-lg"></span>
                <span class="bone bone-sm skel-pdp__chip"></span>
            </div>
            <div class="skel-row skel-pdp__actions">
                <span class="bone"></span><span class="bone"></span><span class="bone"></span>
            </div>
            <span class="bone bone-md"></span>
            <span class="bone bone-line"></span>
            <span class="bone bone-line bone-short"></span>
            <div class="skel-pdp__facts">
                <span class="bone"></span><span class="bone"></span><span class="bone"></span>
                <span class="bone"></span><span class="bone"></span><span class="bone"></span>
                <span class="bone"></span>
            </div>
        </div>
        <aside class="skel-pdp__sheet-side">
            <article class="skel-card">
                <span class="bone bone-line"></span>
                <span class="bone bone-line"></span>
                <span class="bone bone-line"></span>
                <span class="bone bone-xs skel-pdp__meta"></span>
            </article>
            <article class="skel-card">
                <span class="bone bone-md"></span>
                <span class="bone bone-line"></span>
                <span class="bone bone-line"></span>
                <span class="bone bone-line bone-short"></span>
            </article>
        </aside>
    </div>
    <section class="skel-pdp__roles">
        <span class="bone bone-md skel-pdp__roles-title"></span>
        <div class="skel-grid skel-grid--3 skel-grid--stay3">
            {% for _ in "123" %}
                {% include "components/skeleton/role_card.html" %}
            {% endfor %}
        </div>
    </section>
</div>
