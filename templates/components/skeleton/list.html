<div class="skel-pane mt-6" aria-hidden="true">
    {% if kind == "artists" %}
        <div class="artist-grid">
            {% for _ in "12345678" %}
                <article class="skel-card skel-card--tile">
                    <span class="bone bone-photo"></span>
                    <span class="bone bone-md"></span>
                    <div class="skel-row">
                        <span class="bone"></span><span class="bone"></span>
                    </div>
                </article>
            {% endfor %}
        </div>
    {% elif kind == "projects" %}
        <div class="skel-grid skel-grid--3 skel-grid--stay3">
            {% for _ in "123456" %}
                <article class="skel-card">
                    <span class="bone bone-xs"></span>
                    <span class="bone bone-md"></span>
                    <span class="bone bone-sm"></span>
                    <span class="bone bone-sm"></span>
                    <span class="bone bone-btn"></span>
                </article>
            {% endfor %}
        </div>
    {% else %}
        <div class="skel-grid skel-grid--3">
            {% for _ in "123456" %}
                {% include "components/skeleton/role_card.html" %}
            {% endfor %}
        </div>
    {% endif %}
</div>
