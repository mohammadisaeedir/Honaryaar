{% load i18n static %}

<div class="border-b border-base-200 mb-8 pb-6 dark:border-base-800">
    <img src="{% static 'brand/logo-en-light.svg' %}" alt="{% trans 'Honaryaar' %}" class="block h-16 w-auto dark:hidden"/>
    <img src="{% static 'brand/logo-en-dark.svg' %}" alt="{% trans 'Honaryaar' %}" class="hidden h-16 w-auto dark:block"/>
    {% if subtitle %}
        <h1 class="font-semibold mt-6 text-font-important-light dark:text-font-important-dark">{{ subtitle }}</h1>
    {% endif %}
</div>
