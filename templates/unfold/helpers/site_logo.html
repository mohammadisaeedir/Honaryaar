{% load i18n %}

<a href="{% url "admin:index" %}" class="flex items-center min-w-0">
    {% if site_logo.light and site_logo.dark %}
        <img src="{{ site_logo.dark }}" alt="{% trans 'Honaryaar' %}" class="hidden h-10 w-auto max-w-full object-contain object-left dark:block"/>
        <img src="{{ site_logo.light }}" alt="{% trans 'Honaryaar' %}" class="block h-10 w-auto max-w-full object-contain object-left dark:hidden"/>
    {% else %}
        <img src="{{ site_logo }}" alt="{% trans 'Honaryaar' %}" class="h-10 w-auto max-w-full object-contain object-left"/>
    {% endif %}
</a>
