{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اجرانو · Ejranow</title>
  <link rel="icon" href="{% static 'brand/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Vazirmatn:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --aqua: #00B8C8; --ink: #17131A; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      font-family: Vazirmatn, Tahoma, sans-serif;
    }
    .hero { text-align: center; padding: 24px; }
    .logo { height: 84px; width: auto; }
    .tag { margin: 18px 0 0; font-weight: 700; font-size: 18px; }
    .latin {
      margin: 4px 0 0;
      direction: ltr;
      font-family: Outfit, Vazirmatn, sans-serif;
      font-weight: 600;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="hero">
    <img class="logo" src="{% static 'brand/logo-en-light.svg' %}" alt="Ejranow">
    <p class="tag">خلق کن. اجرا کن. دیده شو.</p>
    <p class="latin" lang="en">Create. Perform. Be Seen.</p>
  </main>
</body>
</html>
